[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gni"
version = "0.1.6"
description = "Global Narrative Intelligence — official media narrative monitoring"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "GNI" }]
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "httpx>=0.27",
  "feedparser>=6.0",
  "tenacity>=8.2",
  "pyyaml>=6.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "trafilatura>=1.12",
  "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "playwright>=1.48",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
dashboard = [
  "streamlit>=1.38",
]

[project.scripts]
gni = "gni.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gni"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests that need PostgreSQL or network",
  "e2e: playwright end-to-end browser tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
